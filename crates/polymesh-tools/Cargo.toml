[package]
name = "polymesh-tools"
version = "0.1.0"
edition = "2021"
authors = ["Robert G. Jakabosky <robert@polymesh.network>"]
license = "Apache-2.0"
description = "Helper tools for Polymesh chain operations"
keywords = ["polymesh", "blockchain", "substrate", "tools"]
repository = "https://github.com/PolymeshAssociation/polymesh-api"
homepage = "https://github.com/PolymeshAssociation/polymesh-api"

[features]
default = []
current_release = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
polymesh-api = { workspace = true, default-features = true }
polymesh-api-tester = { workspace = true, default-features = false, features = ["polymesh_v8"] }
sp-weights = { workspace = true, default-features = false }

[[bin]]
name = "polymesh-tools"
path = "src/main.rs"
