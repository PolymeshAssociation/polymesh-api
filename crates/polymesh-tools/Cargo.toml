[package]
name = "polymesh-tools"
version = "0.2.0"
edition = "2021"
authors = ["Robert G. Jakabosky <robert@polymesh.network>"]
license = "Apache-2.0"
description = "Helper tools for Polymesh chain operations"
keywords = ["polymesh", "blockchain", "substrate", "tools"]
repository = "https://github.com/PolymeshAssociation/polymesh-api"
homepage = "https://github.com/PolymeshAssociation/polymesh-api"

[features]
default = []
current_release = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
hex = "0.4"
blake2 = "0.10"
codec = { version = "3", package = "parity-scale-codec", default-features = false, features = ["derive"] }
wasmparser = "0.244"
polymesh-api = { workspace = true, default-features = true }
polymesh-api-tester = { workspace = true, default-features = false, features = ["polymesh_v8"] }
sp-weights = { workspace = true, default-features = false }

# Runtime WASM inspection (version + setCode hash) from the Polymesh subwasm fork.
wasm-loader = { git = "https://github.com/PolymeshAssociation/subwasm.git", branch = "polymesh" }

[[bin]]
name = "polymesh-tools"
path = "src/main.rs"
